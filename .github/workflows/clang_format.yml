name: clang-format

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            clang-format

      # shell: bash gives `bash -eo pipefail`; the implicit shell is `bash -e`
      # without pipefail, so the step would exit with tee's status and never
      # fail. Applied per-step on purpose -- see unit_tests.yml, where the
      # summary step pipes into grep and would break under pipefail.
      - name: Check formatting
        shell: bash
        run: |
          # clang-format --Werror exits non-zero on any formatting difference;
          # pipefail is what lets that status survive the tee, which is here so
          # the output is still captured for the artifact on failure.
          find recorder server client plugins \
            \( -name "*.cpp" -o -name "*.h" \) \
            ! -path "*/test/*" \
            | sort \
            | xargs clang-format --dry-run --Werror 2>&1 | tee clang_format_output.txt

      - name: Show diff on failure
        if: failure()
        run: |
          find recorder server client plugins \
            \( -name "*.cpp" -o -name "*.h" \) \
            ! -path "*/test/*" \
            | sort \
            | while read f; do
                diff <(clang-format "$f") "$f" \
                  && true \
                  || echo "--- needs formatting: $f"
              done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-format-report
          path: clang_format_output.txt
          retention-days: 14

