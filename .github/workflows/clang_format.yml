name: clang-format

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            clang-format

      - name: Check formatting
        run: |
          find recorder server client plugins \
            \( -name "*.cpp" -o -name "*.h" \) \
            ! -path "*/test/*" \
            | sort \
            | xargs clang-format --dry-run --Werror 2>&1 | tee clang_format_output.txt
          # clang-format --Werror exits non-zero on any formatting difference;
          # the tee above preserves output for the artifact even on failure.

      - name: Show diff on failure
        if: failure()
        run: |
          find recorder server client plugins \
            \( -name "*.cpp" -o -name "*.h" \) \
            ! -path "*/test/*" \
            | sort \
            | while read f; do
                diff <(clang-format "$f") "$f" \
                  && true \
                  || echo "--- needs formatting: $f"
              done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-format-report
          path: clang_format_output.txt
          retention-days: 14

